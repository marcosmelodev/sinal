# Sobrepõe a configuração principal somente nos testes: o job agendado fica desligado para não interferir
# nos testes que gravam dados de verdade; os testes do job chamam AvancoDeEncaminhamentoJob.executar() diretamente.
sinal.simulacao.job.habilitado=false
# Segredo JWT dos testes (não é secreto).
sinal.seguranca.jwt.segredo=segredo-de-testes-automatizados-com-mais-de-32-bytes
# Os testes nunca chamam a API real da OpenAI, mesmo com OPENAI_API_KEY definida na máquina.
openai.api.key=
openai.api.url=http://localhost:1/openai-desabilitada-nos-testes
