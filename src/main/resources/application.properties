spring.application.name=sinal
spring.profiles.default=dev

# PostgreSQL: na nuvem (Render) a conexão vem do ambiente. DATABASE_URL precisa estar no formato JDBC
# (jdbc:postgresql://host:5432/banco); os padrões abaixo apontam para o banco local do compose.yaml.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sinal}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Persistência: o schema e a carga inicial (V1, V2...) são do Flyway, aplicados ao subir; o Hibernate apenas valida.
# O dialeto PostgreSQL é detectado automaticamente pelo Hibernate a partir da conexão.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Instant gravado como TIMESTAMP(6) sem fuso, em UTC (independe do fuso da sessão/JVM).
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.flyway.enabled=true

# Localização: acima deste raio de incerteza (metros) o Chamado é sinalizado com baixa precisão (LC4, N2).
sinal.localizacao.limiar-baixa-precisao-metros=100

# Simulação do encaminhamento (Etapa 4 §18): durações configuráveis, não são regra de negócio.
sinal.simulacao.atraso-encaminhamento=PT8S
sinal.simulacao.atraso-encerramento=PT20S
# Job da simulação: avanço dos encaminhamentos vencidos e reconciliação de chamados sem encaminhamento.
sinal.simulacao.job.habilitado=true
sinal.simulacao.job.intervalo=PT1S
sinal.simulacao.job.lote=50
sinal.simulacao.reconciliacao.carencia=PT30S

# Segurança (Etapa 4 §20): access token JWT HS256 de curta duração. O segredo (>= 32 bytes) vem do ambiente;
# sem SINAL_JWT_SEGREDO a aplicação não sobe fora do perfil dev.
sinal.seguranca.jwt.segredo=${SINAL_JWT_SEGREDO}
sinal.seguranca.jwt.validade=PT15M

# Chat em LIBRAS (OpenAI chat completions). A chave vem do ambiente; sem OPENAI_API_KEY o chat responde 503
# CHAT_INDISPONIVEL.
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.api.model=gpt-4o-mini
openai.api.timeout-conexao=PT10S
openai.api.timeout-resposta=PT30S
