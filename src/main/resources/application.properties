spring.application.name=sinal
spring.profiles.default=dev

# Persistência: o schema é responsabilidade do Flyway; o Hibernate apenas valida.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# Autenticação provisória por cabeçalho X-Usuario-Id (insegura): desligada por padrão; removida com o JWT.
sinal.autenticacao.cabecalho-provisorio.habilitado=false

# Localização: acima deste raio de incerteza (metros) o Chamado é sinalizado com baixa precisão (LC4, N2).
sinal.localizacao.limiar-baixa-precisao-metros=100
