# MySQL local (ver compose.yaml). Credenciais reais devem vir das variáveis de ambiente.
spring.datasource.url=${SINAL_DB_URL:jdbc:mysql://localhost:3306/sinal}
spring.datasource.username=${SINAL_DB_USERNAME:sinal}
spring.datasource.password=${SINAL_DB_PASSWORD:sinal}

# Somente para desenvolvimento, até a autenticação por JWT.
sinal.autenticacao.cabecalho-provisorio.habilitado=true
