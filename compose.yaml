# PostgreSQL 17 para desenvolvimento local: docker compose up -d
# Credenciais apenas locais; os mesmos valores são os padrões de application.properties.
services:
  postgres:
    image: postgres:17
    container_name: sinal-postgres
    environment:
      POSTGRES_DB: sinal
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - sinal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d sinal"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sinal-postgres-data:
