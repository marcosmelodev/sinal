# MySQL 8.4 para desenvolvimento local: docker compose up -d
# Credenciais apenas locais; os mesmos valores são os padrões de application-dev.properties.
services:
  mysql:
    image: mysql:8.4
    container_name: sinal-mysql
    environment:
      MYSQL_DATABASE: sinal
      MYSQL_USER: ${SINAL_DB_USERNAME:-sinal}
      MYSQL_PASSWORD: ${SINAL_DB_PASSWORD:-sinal}
      MYSQL_ROOT_PASSWORD: ${SINAL_DB_ROOT_PASSWORD:-root}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - sinal-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sinal-mysql-data:
